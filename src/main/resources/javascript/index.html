
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f7f6;
        }
        .container-custom {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h2 { color: #333; }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .error-message { 
            color: #dc3545; 
            font-size: 0.85rem; 
            margin-top: 5px; 
            display: block; 
        }
        button.custom-btn {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
        }
        .btn-submit { background-color: #28a745; }
        .btn-clear { background-color: #6c757d; }
        .btn-edit { background-color: #007bff; margin-right: 5px; }
        .btn-delete { background-color: #dc3545; }
        
        .btn-logout { background-color: #dc3545; float: right; }
        .header-group { overflow: auto; margin-bottom: 20px; }
        .header-group h2 { margin: 0; float: left; }
        
        .table-container {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-top: 30px;
            border: 1px solid #eef2f5;
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background-color: #fff;
        }
        th, td {
            padding: 16px 20px;
            text-align: left;
            border-bottom: 1px solid #eef2f5;
            transition: background-color 0.2s ease;
        }
        th {
            background-color: #f8fafc;
            color: #4a5568;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tbody tr {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        tbody tr:hover td {
            background-color: #f8faff;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container-custom">
    <div class="header-group">
        <h2>Student Management Dashboard</h2>
        <button type="button" class="custom-btn btn-logout" id="logoutBtn" onclick="logoutUser()">Logout</button>
    </div>
    
    <form id="studentForm" novalidate>
        <input type="hidden" id="studentId">
        
        <div class="form-group">
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" required minlength="2" maxlength="50">
            <span id="firstNameError" class="error-message"></span>
        </div>
        <div class="form-group">
            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" required minlength="2" maxlength="50">
            <span id="lastNameError" class="error-message"></span>
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$">
            <span id="emailError" class="error-message"></span>
        </div>
        
        <button type="submit" class="custom-btn btn-submit" id="submitBtn">Add Student</button>
    </form>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
            </tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="systemModal" tabindex="-1" aria-labelledby="systemModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header" id="modalHeader">
        <h5 class="modal-title" id="systemModalLabel">Notification</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="systemModalBody">
        ...
      </div>
      <div class="modal-footer" id="systemModalFooter">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="modalCancelBtn">Close</button>
        <button type="button" class="btn btn-primary d-none" id="modalConfirmBtn">Confirm</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="validation.js"></script>
<script src="app.js"></script>
</body>
</html>
